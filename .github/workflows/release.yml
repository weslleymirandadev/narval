name: Release

# One binary per platform, carrying the runtime object and the standard library inside itself
# (cmake/NarvalEmbedBlob.cmake, src/frontend/narval_home.cpp): the download is a single file and
# its first run writes those assets into the user's cache directory.
#
# Each job builds NATIVELY, because the compiler hands the generated program to the platform's C
# toolchain — gcc on Linux, MinGW-w64 gcc on Windows — and the runtime object it embeds has to be
# one that toolchain can link. LLVM/MLIR must be the version the compiler builds against, the
# same constraint the LSP workflow has on Windows.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # gh release create

env:
  LLVM_VERSION: 22.1.4

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch LLVM/MLIR ${{ env.LLVM_VERSION }}
        run: |
          set -uo pipefail
          # The Linux asset is named LLVM-<version>-Linux-X64.tar.xz — clang+llvm-* is the Windows
          # spelling — so ask the release for the URL instead of assembling the name here.
          api="https://api.github.com/repos/llvm/llvm-project/releases/tags/llvmorg-${LLVM_VERSION}"
          assets=$(curl -sSL -H "Authorization: Bearer ${{ github.token }}" "$api")
          url=$(printf '%s' "$assets" | grep -o 'https://[^"]*Linux-X64\.tar\.xz' | head -1)
          if [ -z "$url" ]; then
            echo "no Linux-X64 asset for LLVM ${LLVM_VERSION}; the release publishes:"
            printf '%s\n' "$assets" | grep -o '"name": *"[^"]*"' | head -40
            exit 1
          fi
          echo "using $url"
          curl -L --fail -o llvm.tar.xz "$url"
          mkdir -p llvm && tar xf llvm.tar.xz -C llvm
          # The top-level directory of the archive has changed names between releases; the MLIR
          # package inside it is what identifies the prefix to configure against.
          config=$(find llvm -name MLIRConfig.cmake -print -quit)
          if [ -z "$config" ]; then
            echo "no MLIRConfig.cmake inside $url; the archive holds:"
            find llvm -maxdepth 2 -type d | head -40
            exit 1
          fi
          prefix=$(dirname "$(dirname "$(dirname "$config")")")
          echo "LLVM_PREFIX=$PWD/$prefix" >> "$GITHUB_ENV"
          echo "$PWD/$prefix/bin" >> "$GITHUB_PATH"
          echo "LLVM ${LLVM_VERSION} in $prefix"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DMLIR_DIR="$LLVM_PREFIX/lib/cmake/mlir" \
            -DLLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm" \
            -DNARVAL_VERSION="${GITHUB_REF_NAME#v}"

      - name: Build
        run: cmake --build build --target Narval -j 2

      - name: Verify the binary is self-contained
        run: |
          # A dynamic libLLVM/libMLIR/libclang would make the download useless on a machine
          # without that exact LLVM installation.
          if ldd build/narval | grep -Ei 'libLLVM|libMLIR|libclang'; then
            echo "::error::narval is linked against LLVM dynamically — the release must be one file"
            exit 1
          fi
          build/narval --version

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="narval-$version-x86_64-linux-gnu"
          mkdir -p "dist/$name"
          cp build/narval LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the MSVC build of LLVM/MLIR ${{ env.LLVM_VERSION }}
        shell: pwsh
        run: |
          # The MSVC build, because a MinGW C++ compiler cannot link its libraries.
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-${env:LLVM_VERSION}/clang+llvm-${env:LLVM_VERSION}-x86_64-pc-windows-msvc.tar.xz"
          curl.exe -L --fail -o llvm.tar.xz $url
          tar xf llvm.tar.xz
          if ($LASTEXITCODE -ne 0) { throw "tar failed with exit code $LASTEXITCODE" }
          $root = (Get-ChildItem -Directory -Filter "clang+llvm-*" | Select-Object -First 1).FullName
          if (-not $root) { throw "the archive did not extract a clang+llvm-* directory" }
          # The MLIR package inside the archive is what identifies the prefix to configure against,
          # so the layout of a release is not assumed here.
          $config = Get-Item "$root/lib/cmake/mlir/MLIRConfig.cmake" -ErrorAction SilentlyContinue
          if (-not $config) {
            $config = Get-ChildItem -Path $root -Recurse -Filter MLIRConfig.cmake -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $config) {
            "top level:"; Get-ChildItem -Directory | Select-Object -ExpandProperty Name
            "lib:"; Get-ChildItem "$root/lib" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
            throw "no MLIRConfig.cmake in the archive"
          }
          $prefix = $config.Directory.Parent.Parent.FullName
          "LLVM_PREFIX=$prefix" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # llvm-config drives the project's compile and link flags; GITHUB_PATH applies to the
          # following steps, which is where cmake runs.
          "$prefix/bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "LLVM $($env:LLVM_VERSION) in $prefix"

      - name: MinGW-w64 gcc (embedded runtime object and linker for generated programs)
        shell: pwsh
        run: |
          # The runtime object that travels inside narval.exe is compiled by MinGW gcc — cl.exe
          # cannot produce it — and it is also what the generated programs are linked against.
          $dirs = @("C:\ProgramData\mingw64\mingw64\bin", "C:\mingw64\bin", "C:\msys64\mingw64\bin", "C:\ProgramData\chocolatey\bin")
          $probe = { $dirs | ForEach-Object { Join-Path $_ "gcc.exe" } | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          $gcc = & $probe
          if (-not $gcc) {
            choco install mingw --no-progress -y
            $gcc = & $probe
          }
          if (-not $gcc) { throw "MinGW-w64 gcc not found" }
          Split-Path -Parent $gcc | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & $gcc --version | Select-Object -First 1

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-win `
            "-DNARVAL_VERSION=$($env:GITHUB_REF_NAME -replace '^v','')" `
            "-DMLIR_DIR=$env:LLVM_PREFIX/lib/cmake/mlir" `
            "-DLLVM_DIR=$env:LLVM_PREFIX/lib/cmake/llvm"

      - name: Build
        shell: pwsh
        run: cmake --build build-win --target Narval --config Release -j 2

      - name: Smoke test and package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          $name = "narval-$version-x86_64-windows-msvc"
          $exe = (Get-ChildItem build-win -Recurse -Filter narval.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw "narval.exe was not produced" }
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item $exe "dist/$name/narval.exe"
          Copy-Item LICENSE, README.md "dist/$name/"
          # Materialises the embedded assets in this runner's cache: unpacking alone does not
          # exercise the first-run path.
          & "dist/$name/narval.exe" --version
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force "dist/$name"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: [linux-x86_64, windows-x86_64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Narval $GITHUB_REF_NAME" --generate-notes
